version: '3.8'

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: sonicberry_navidrome
    user: 1000:1000
    ports:
      - "4533:4533"
    environment:
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
    volumes:
      - ./data/navidrome:/data
      - /mnt/music/library:/music:ro 
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    container_name: sonicberry_slskd
    ports:
      - "5030:5030"     
      - "50300:50300"   
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
    volumes:
      - ./data/slskd:/app
      - /mnt/music/staging:/music 
    restart: unless-stopped